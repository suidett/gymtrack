<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymTrack · Revisión 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sistema.css">
<style>
  .hoja { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; }
  .hoja.una { grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .ficha { background: var(--p-sup); border: 1px solid var(--p-borde); border-radius: 10px; padding: 14px; min-width: 0; }
  .ficha-cabeza { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .ficha-cabeza h2 { margin: 0; font-size: 17px; }
  .ficha-cabeza .ceja { margin: 0 0 2px; font-size: 12px; color: var(--p-texto-2); font-weight: 600; }
  .ficha-cabeza a { color: var(--p-texto-2); font-size: 13px; }
  .ficha-cabeza .datos { font: 500 12px/1 var(--mono); color: var(--p-texto-2); }

  .cuadros { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; }
  .cuadros .col { font-size: 12px; color: var(--p-texto-2); font-weight: 600; }
  .cuadros .col b { font: 700 11px/1 var(--mono); margin-left: 4px; }
  .cuadros .fila { font-size: 12px; color: var(--p-texto-2); font-weight: 600; writing-mode: vertical-rl; transform: rotate(180deg); justify-self: center; }
  .cuadros canvas { display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; border: 1px solid var(--p-borde); }
  .una .cuadros { grid-template-columns: 56px repeat(3, minmax(0, 1fr)); gap: 10px; }
  .una .cuadros .col, .una .cuadros .fila { font-size: 14px; }

  .avisos { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .avisos li { padding: 4px 0 4px 10px; border-left: 3px solid #F5B83D; margin-top: 4px; }
  .avisos li b { font: 700 12px/1 var(--mono); margin-right: 6px; }
  .avisos .bien { border-left-color: var(--p-borde); color: var(--p-texto-2); }
  .pendiente { display: flex; align-items: center; justify-content: center; min-height: 120px; border: 1px dashed var(--p-borde);
    border-radius: 8px; color: var(--p-texto-2); font: 700 14px/1 var(--mono); }
  .estado-hoja { color: var(--p-texto-2); font-size: 13px; margin: 0 0 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<main class="maqueta">
  <header class="maqueta-cabeza">
    <h1>Revisión · Ejercicios en 3D</h1>
    <p>Cada ejercicio al inicio, a la mitad y en su punto más exigente, de lado y de frente · <a href="../ejercicios-3d.html">ver en el teléfono</a></p>
  </header>

  <div class="controles" role="group" aria-label="Controles de la revisión">
    <label class="grupo"><span class="rot">Ejercicio</span><select class="ctl" id="sel-ej"><option value="">Todos</option></select></label>
    <label class="grupo"><span class="rot">Tema</span>
      <select class="ctl" id="sel-tema"><option value="gimnasio">Modo gimnasio</option><option value="clara">Clara</option></select></label>
  </div>
  <p class="estado-hoja" id="estado" role="status">Dibujando…</p>
  <div class="hoja" id="hoja"></div>
  <div id="colores" data-tema="gimnasio" hidden></div>
</main>

<script type="module">
import * as THREE from 'three';
import { crearEscena, colores, cargarEjercicio, VISTAS } from './motor.js';
import IDS, { NOMBRES } from './ejercicios/indice.js';

const selEj = document.getElementById('sel-ej'), selTema = document.getElementById('sel-tema');
selEj.options[0].textContent = `Los ${IDS.length}`;
selEj.innerHTML += IDS.map((id) => `<option value="${id}">${NOMBRES[id] || id}</option>`).join('');
const leer = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const fmtT = (t) => t.toFixed(2).replace('.', ',');
const ROTULOS = ['Inicio', 'Mitad', 'Más exigente'];
// Equipos de la línea de datos, agrupados: «barra, 17 bloques» en vez de «barra, bloque, bloque...».
const EQUIPO = { suelo: ['suelo', 'suelos'], banca: ['banca', 'bancas'], barra: ['barra', 'barras'],
  mancuernas: ['mancuernas', 'mancuernas'], kettlebell: ['kettlebell', 'kettlebells'], polea: ['polea', 'poleas'],
  bloque: ['bloque', 'bloques'], cajon: ['cajón', 'cajones'], dominadas: ['barra fija', 'barras fijas'],
  paralelas: ['paralelas', 'paralelas'] };
function equipos(lista = []) {
  const n = new Map();
  for (const e of lista) n.set(e.tipo, (n.get(e.tipo) || 0) + 1);
  return [...n].map(([tipo, k]) => { const [uno, varios] = EQUIPO[tipo] || [tipo, tipo]; return k > 1 ? `${k} ${varios}` : uno; }).join(', ');
}
const FILAS = { lado: 'Lado', frente: 'Frente', tres: '3/4' };

// Un solo renderer WebGL para todos: dibuja cada cuadro y lo copia a un lienzo 2D.
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
const camara = new THREE.PerspectiveCamera(28, 1, 0.05, 80);
const cache = {};
const cargar = (id) => (cache[id] ??= cargarEjercicio(id));

let turno = 0;
async function dibujar() {
  const mio = ++turno;
  const q = leer();
  const tema = q.tema === 'clara' ? 'clara' : 'gimnasio';
  const una = IDS.includes(q.ej) ? q.ej : '';
  selEj.value = una; selTema.value = tema;
  document.getElementById('colores').dataset.tema = tema;
  const col = colores(document.getElementById('colores'));
  const hoja = document.getElementById('hoja');
  hoja.className = una ? 'hoja una' : 'hoja';
  const ids = una ? [una] : IDS;
  const vistas = una ? ['lado', 'frente', 'tres'] : ['lado', 'frente'];
  const estado = document.getElementById('estado');
  estado.textContent = 'Dibujando…';
  window.revisionLista = false;

  const ejs = await Promise.all(ids.map(cargar));
  if (mio !== turno) return;
  hoja.innerHTML = ids.map((id, i) => {
    const ej = ejs[i];
    if (!ej) {
      return `<section class="ficha"><div class="ficha-cabeza"><div><p class="ceja">Sin archivo</p><h2>${NOMBRES[id] || id}</h2></div></div>
        <div class="pendiente">Pendiente</div></section>`;
    }
    const mom = Array.isArray(ej.momentos) && ej.momentos.length === 3 ? ej.momentos : [0, 0.25, 0.5];
    return `<section class="ficha" data-id="${id}">
      <div class="ficha-cabeza"><div><p class="ceja">${ej.ceja || ''}</p><h2>${ej.nombre || id}</h2></div>
        <span class="datos">${String(ej.periodo || '').replace('.', ',')} s · ${equipos(ej.equipos) || 'sin equipo'}</span>
        ${una ? `<a href="#tema=${tema}">Ver los ${IDS.length}</a>` : `<a href="#ej=${id}&tema=${tema}">Ver grande</a>`}</div>
      <div class="cuadros"><span></span>${mom.map((t, k) => `<span class="col">${ROTULOS[k]}<b>t ${fmtT(t)}</b></span>`).join('')}
        ${vistas.map((v) => `<span class="fila">${FILAS[v]}</span>${mom.map((t) => `<canvas data-v="${v}" data-t="${t}" aria-label="${ej.nombre}, ${FILAS[v]}, t ${fmtT(t)}"></canvas>`).join('')}`).join('')}
      </div>
      <ul class="avisos" data-avisos><li class="bien">Revisando…</li></ul></section>`;
  }).join('');

  const dpr = Math.min(devicePixelRatio || 1, 2);
  for (let i = 0; i < ids.length; i++) {
    const ej = ejs[i]; if (!ej) continue;
    const ficha = hoja.querySelector(`.ficha[data-id="${ids[i]}"]`);
    const esc = crearEscena(ej, col);
    for (const lienzo of ficha.querySelectorAll('canvas')) {
      const w = Math.round(lienzo.clientWidth * dpr), h = Math.round(lienzo.clientHeight * dpr);
      lienzo.width = w; lienzo.height = h;
      renderer.setPixelRatio(1); renderer.setSize(w, h, false);
      camara.aspect = w / h; camara.updateProjectionMatrix();
      esc.posar(parseFloat(lienzo.dataset.t));
      const dir = (ej.vistas && ej.vistas[lienzo.dataset.v]) || VISTAS[lienzo.dataset.v];
      const r = esc.encuadrar(camara, dir);
      camara.position.copy(r.posicion); camara.lookAt(r.objetivo);
      esc.mirarDesde(camara.position);
      renderer.render(esc.escena, camara);
      lienzo.getContext('2d').drawImage(renderer.domElement, 0, 0, w, h);
    }
    const avisos = esc.revisar();
    ficha.querySelector('[data-avisos]').innerHTML = avisos.length
      ? avisos.map((a) => `<li><b>t ${fmtT(a.t)}</b>${a.texto}</li>`).join('')
      : '<li class="bien">Sin avisos: nada atraviesa el suelo ni el equipo, los pies no resbalan y las articulaciones están en rango.</li>';
    esc.destruir();
    await new Promise((r) => setTimeout(r));
    if (mio !== turno) return;
  }
  const hechos = ejs.filter(Boolean).length;
  estado.textContent = `${hechos} de ${ids.length} con animación${hechos < ids.length ? ` · ${ids.length - hechos} pendientes` : ''}.`;
  window.revisionLista = true;
}

const ir = (cambios) => {
  const q = { ...leer(), ...cambios };
  Object.keys(q).forEach((k) => { if (!q[k]) delete q[k]; });
  location.hash = new URLSearchParams(q).toString();
};
selEj.addEventListener('change', () => ir({ ej: selEj.value }));
selTema.addEventListener('change', () => ir({ tema: selTema.value }));
addEventListener('hashchange', dibujar);
let reajuste; addEventListener('resize', () => { clearTimeout(reajuste); reajuste = setTimeout(dibujar, 200); });
document.fonts.ready.then(dibujar);
</script>
</body>
</html>
