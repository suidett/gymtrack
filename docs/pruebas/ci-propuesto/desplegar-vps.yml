# ─────────────────────────────────────────────────────────────────────────────
# Desplegar en el VPS (Vultr) · borrador
#
# Reemplaza el despliegue a Railway de staging.yml y version.yml. Es reutilizable:
#   staging.yml        en cada push a main lo llama con entorno «staging» y versión
#                      sha-<commit>: construye la imagen, la publica en GHCR y despliega
#   version.yml        al empujar una etiqueta v1.2.3 lo llama con entorno «produccion»,
#                      después de «comprobar», «suite-completa» y «fotos-staging».
#                      La aprobación la pide el entorno «produccion» de GitHub.
#   workflow_dispatch  a mano: volver atrás o redesplegar una versión en un entorno
#
# Cómo entra: SSH con el usuario «despliegue» y una llave por entorno, atada en el
# servidor a puerta-ssh.sh (docs/pruebas/infra-propuesta/). La llave de staging no
# sirve para producción. No usa la API de Vultr: solo SSH, así que cambiar de
# proveedor es cambiar VULTR_HOST y la llave del host.
#
# En el servidor, desplegar.sh baja la imagen, respalda (producción), migra con
# Prisma, levanta, revisa /health con la versión y vuelve solo a la anterior si
# falla. Aquí, después, corre el humo; si el humo falla, pide «volver».
#
# Producción a mano (workflow_dispatch con desplegar y v1.2.3): córrelo DESDE LA
# ETIQUETA («Use workflow from» = v1.2.3), no desde main. «plan» lo exige: así el
# humo usa el código de esa versión y «promover» etiqueta el commit de la etiqueta.
#
# Al activarlo, copia también ci-propuesto/acciones/preparar/ a .github/actions/preparar/:
# el paso del humo lo usa.
# ─────────────────────────────────────────────────────────────────────────────
name: Desplegar en el VPS

on:
  workflow_call:
    inputs:
      entorno:
        type: string
        required: true
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      accion:
        type: choice
        options: [volver, desplegar]
        default: volver
      entorno:
        type: choice
        options: [staging, produccion]
        default: staging
      version:
        description: "Solo para desplegar: sha-<commit> en staging, v1.2.3 en producción"
        type: string
        required: false
  # No tiene «push» propio a propósito: staging.yml y version.yml ya lo llaman, y un
  # segundo disparador desplegaría dos veces.

permissions:
  contents: read

# bash con pipefail («bash -eo pipefail»): sin esto un «curl | tee» que falla en curl
# sale bien porque tee terminó bien.
defaults:
  run:
    shell: bash

# Un despliegue por entorno a la vez, y nunca se cancela uno a medias.
concurrency:
  group: vps-${{ inputs.entorno || 'staging' }}
  cancel-in-progress: false

env:
  IMAGEN: ${{ vars.IMAGEN_API }}   # ghcr.io/<dueño-en-minúsculas>/gymtrack-api

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      accion: ${{ steps.p.outputs.accion }}
      entorno: ${{ steps.p.outputs.entorno }}
      version: ${{ steps.p.outputs.version }}
    steps:
      - id: p
        env:
          EVENTO: ${{ github.event_name }}
          IN_ACCION: ${{ inputs.accion }}
          IN_ENTORNO: ${{ inputs.entorno }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENTO" = workflow_dispatch ]; then
            accion=$IN_ACCION; entorno=$IN_ENTORNO; version=$IN_VERSION
          else
            accion=desplegar; entorno=$IN_ENTORNO; version=$IN_VERSION   # llamado por staging.yml o version.yml
          fi
          if [ "$accion" = desplegar ] && [ -z "$version" ]; then
            echo "::error::falta la versión"; exit 1
          fi
          # Producción se despliega desde su etiqueta: version.yml ya corre en refs/tags/v1.2.3;
          # a mano, elige la etiqueta en «Use workflow from». Desde main, el humo sería el de
          # main contra una versión vieja y podría hacer volver atrás a producción sin motivo.
          if [ "$accion" = desplegar ] && [ "$entorno" = produccion ] && [ "$GITHUB_REF" != "refs/tags/$version" ]; then
            echo "::error::corre este workflow desde la etiqueta $version (Use workflow from), no desde $GITHUB_REF"; exit 1
          fi
          { echo "accion=$accion"; echo "entorno=$entorno"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  # Solo cuando staging pide el commit de esta corrida: la imagen que después se
  # promueve a producción sin recompilar.
  imagen:
    needs: plan
    if: >-
      needs.plan.outputs.accion == 'desplegar' && needs.plan.outputs.entorno == 'staging' &&
      needs.plan.outputs.version == format('sha-{0}', github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # apps/api/Dockerfile (el mismo de «api-build» en api.yml): su etapa final trae el
      # CLI de Prisma, prisma/ y prisma.config.ts, que desplegar.sh usa para migrar.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # El Dockerfile lee ARG COMMIT_SHA y lo deja en ENV COMMIT_SHA; /health lo devuelve
          # en «commit». Siempre el SHA completo de 40 caracteres (nunca --short): version.yml
          # («comprobar») lo compara tal cual con GITHUB_SHA.
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Producción no recompila: le pone la etiqueta v1.2.3 a la misma imagen que ya
  # corrió en staging (mismo digest). version.yml ya revisó en «comprobar» que la
  # etiqueta está en main y que staging corre ese commit. El commit sale de la
  # etiqueta git, no de GITHUB_SHA, y si v1.2.3 ya existe en GHCR con otro digest,
  # se niega: una versión publicada no se vuelve a apuntar a otro código.
  promover:
    needs: plan
    if: needs.plan.outputs.accion == 'desplegar' && needs.plan.outputs.entorno == 'produccion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # trae las etiquetas para leer a qué commit apunta v1.2.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Etiquetar la imagen probada en staging
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          COMMIT=$(git rev-list -n1 "refs/tags/$VERSION") \
            || { echo "::error::no existe la etiqueta git $VERSION"; exit 1; }
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          ORIGEN=$(digest "$IMAGEN:sha-$COMMIT") \
            || { echo "::error::no existe $IMAGEN:sha-$COMMIT; ¿la etiqueta apunta a un commit que pasó por main?"; exit 1; }
          if YA=$(digest "$IMAGEN:$VERSION" 2>/dev/null); then
            if [ "$YA" = "$ORIGEN" ]; then
              echo "$IMAGEN:$VERSION ya apunta a sha-$COMMIT ($ORIGEN): nada que hacer"; exit 0
            fi
            echo "::error::$IMAGEN:$VERSION ya existe con otro digest ($YA, no $ORIGEN). No se reescribe una versión publicada."; exit 1
          fi
          docker buildx imagetools create -t "$IMAGEN:$VERSION" "$IMAGEN:sha-$COMMIT"

  desplegar:
    needs: [plan, imagen, promover]
    # imagen y promover se saltan según el caso: cada uno tiene que haber salido bien o
    # haberse saltado. Si alguno falló o se canceló, no se despliega.
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.imagen.result == 'success' || needs.imagen.result == 'skipped') &&
      (needs.promover.result == 'success' || needs.promover.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # «produccion» pide aprobación: en GitHub basta UNA persona de la lista, así que
    # se configura con «Prevent self-review» para que quien etiquetó no se apruebe solo.
    environment: ${{ needs.plan.outputs.entorno }}
    permissions:
      contents: read
      packages: read      # el token que viaja al servidor solo puede leer la imagen
      issues: write
    env:
      ACCION: ${{ needs.plan.outputs.accion }}
      ENTORNO: ${{ needs.plan.outputs.entorno }}
      VERSION: ${{ needs.plan.outputs.version }}
      API_URL: ${{ needs.plan.outputs.entorno == 'produccion' && vars.PRODUCCION_API_URL || vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4

      # La llave del host va fija: nunca StrictHostKeyChecking=no.
      - name: Preparar SSH
        env:
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VULTR_HOST: ${{ vars.VULTR_HOST }}
          VULTR_SSH_HOST_KEY: ${{ vars.VULTR_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/despliegue && chmod 600 ~/.ssh/despliegue
          printf '%s %s\n' "$VULTR_HOST" "$VULTR_SSH_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/despliegue\n  BatchMode yes\n  ServerAliveInterval 30\n' \
            "$VULTR_HOST" "${{ vars.VULTR_SSH_USER }}" > ~/.ssh/config

      # El token de GitHub viaja por stdin, sirve solo para leer la imagen y vence con el job.
      - name: Desplegar en el servidor
        id: despliegue
        if: env.ACCION == 'desplegar'
        env:
          GH_TOKEN_IMAGEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN_IMAGEN" | ssh vps "desplegar $ENTORNO $VERSION"

      - name: Volver a la versión anterior
        if: env.ACCION == 'volver'
        run: ssh vps "volver $ENTORNO" </dev/null

      # Lo mínimo desde afuera: https con la versión nueva, http redirige (SEG-022),
      # las rutas de prueba no existen (SEG-025).
      - name: Revisión desde afuera
        id: afuera
        run: |
          curl -fsS "$API_URL/health" | tee health.json
          if [ "$ACCION" = desplegar ]; then grep -q "\"version\":\"$VERSION\"" health.json; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' "${API_URL/https:/http:}/health")" = 308
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_URL/test/reset")" = 404

      # PENDIENTE: los scripts «humo:staging» y «humo:produccion» todavía no existen en
      # apps/api/package.json. Mientras no estén, el humo se salta con un aviso (y por lo
      # tanto tampoco hay vuelta atrás por humo): en la fase 0 la API solo tiene /health,
      # que ya revisaron desplegar.sh y «Revisión desde afuera».
      - name: ¿Hay humo para este entorno?
        id: hay-humo
        if: env.ACCION == 'desplegar'
        run: |
          if jq -e --arg s "humo:$ENTORNO" '.scripts[$s]' apps/api/package.json >/dev/null; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          else
            echo "si=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/api/package.json no tiene «humo:$ENTORNO»: se salta el humo"
          fi

      - uses: ./.github/actions/preparar
        if: steps.hay-humo.outputs.si == 'true'

      # Staging: ingresar, GET /me/today, crear y cerrar una sesión, sincronizar un lote de 2,
      # pedir la exportación; con las cuentas humo.* y borrando lo que crea.
      # Producción: solo lectura con una cuenta interna, sin datos de salud.
      - name: Humo
        id: humo
        if: steps.hay-humo.outputs.si == 'true'
        env:
          HUMO_CLAVE: ${{ needs.plan.outputs.entorno == 'produccion' && secrets.HUMO_CLAVE_PRODUCCION || secrets.HUMO_CLAVE }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCCION_API_URL: ${{ vars.PRODUCCION_API_URL }}
        run: pnpm --filter api run "humo:$ENTORNO"

      # Si desplegar.sh ya volvió solo (falló /health), no se vuelve otra vez: eso
      # llevaría a la versión de antes de la anterior. Solo si el humo corrió y falló
      # (si se saltó por no existir el script, no hay nada que volver).
      - name: Volver atrás si el humo falló
        if: failure() && steps.despliegue.outcome == 'success' && steps.humo.outcome == 'failure'
        run: ssh vps "volver $ENTORNO" </dev/null

      - name: Avisar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ETIQUETA=$([ "$ENTORNO" = produccion ] && echo produccion-rota || echo staging-roto)
          gh issue create --label "$ETIQUETA" \
            --title "$ENTORNO roto al $ACCION ${VERSION:-}" \
            --body "Falló: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. El workflow ya intentó volver a la versión anterior; revisa con «estado» por SSH o con workflow_dispatch."

      - name: Resumen
        if: always()
        run: |
          {
            echo "### $ACCION en $ENTORNO"
            echo "- Versión pedida: \`${VERSION:-anterior}\`"
            echo "- /health: \`$(cat health.json 2>/dev/null || echo 'sin respuesta')\`"
          } >> "$GITHUB_STEP_SUMMARY"
