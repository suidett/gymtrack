# ─────────────────────────────────────────────────────────────────────────────
# E2E en Android con Maestro · borrador
#
# En cada PR y push a main corre el humo (etiqueta «humo» de Maestro). La noche y
# las versiones lo llaman como workflow reutilizable con otra suite:
#   humo            E2E-002, E2E-007, E2E-010, E2E-020 (check obligatorio «e2e-humo»)
#   completo        E2E-001 a E2E-022, SEG-023 y SEG-029, con un reintento por flujo
#   compatibilidad  el humo en Android 10 (API 29), 360 dp y fuente al 130 % (ACC-005, ACC-008)
#   sin-senal       flujos con Toxiproxy entre el emulador y la API (SYNC-006, SYNC-008, SYNC-009)
#
# Todo corre dentro del job: PostgreSQL 16, MinIO, Mailpit, Toxiproxy, la API y el
# worker con NODE_ENV=test (docker compose), y la app en su variante «e2e», que
# usa el reloj de prueba y apunta al host del emulador (10.0.2.2). No usa secretos,
# así que también corre en PR desde forks.
# ─────────────────────────────────────────────────────────────────────────────
name: E2E Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      suite:
        description: humo, completo, compatibilidad o sin-senal
        type: string
        default: humo
      nivel_api:
        type: number
        default: 34
      perfil:
        description: perfil de hardware del emulador
        type: string
        default: pixel_6
      escala_fuente:
        type: string
        default: "1.0"
      reintentos:
        description: 0 en PR; 1 de noche (ver «Política para pruebas inestables» en ci.md)
        type: number
        default: 0

permissions:
  contents: read

env:
  SUITE: ${{ inputs.suite || 'humo' }}
  NIVEL_API: ${{ inputs.nivel_api || 34 }}
  PERFIL: ${{ inputs.perfil || 'pixel_6' }}
  ESCALA_FUENTE: ${{ inputs.escala_fuente || '1.0' }}
  REINTENTOS: ${{ inputs.reintentos || 0 }}
  MAESTRO_VERSION: "PENDIENTE"   # fijar una versión exacta de Maestro al activar
  SALIDA: maestro-salida

jobs:
  # Solo en PR: mira si el PR toca algo que afecte a la app o a la API.
  # En push, de noche y en versiones se salta y el job e2e corre siempre.
  cambios:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.filtro.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            correr:
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/e2e-android.yml'
              - '.github/scripts/**'
              - '.github/actions/**'

  e2e:
    name: e2e-${{ inputs.suite || 'humo' }}
    needs: cambios
    # Corre si «cambios» se saltó (push, noche, versión), si falló, o si el PR toca algo
    # relevante. Solo se salta cuando «cambios» terminó bien y dijo que no hay nada que
    # correr; así un fallo de «cambios» no deja el check «e2e-humo» aprobado por saltarse.
    if: ${{ !cancelled() && (needs.cambios.result != 'success' || needs.cambios.outputs.correr == 'true') }}
    runs-on: ubuntu-latest
    # Humo y compatibilidad: 4 flujos más la compilación. Completa: 22 flujos en un solo
    # emulador. Si la completa pasa de 90 minutos, se parte en dos emuladores (ci.md).
    timeout-minutes: ${{ (inputs.suite == 'completo' && 150) || (inputs.suite == 'sin-senal' && 60) || 45 }}
    # La concurrencia va en el job (no en el workflow) porque este archivo también se
    # llama como reutilizable, y así cada suite tiene su propio grupo.
    concurrency:
      group: e2e-${{ inputs.suite || 'humo' }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/preparar

      - name: Secretos de esta corrida
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "SEMILLA_CLAVE=$(openssl rand -base64 18)" >> "$GITHUB_ENV"

      # El emulador necesita KVM en los runners de Linux.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # PENDIENTE: apps/api/docker-compose.pruebas.yml con postgres:16, minio, mailpit,
      # toxiproxy, api y worker. La API expone /test/reset, /test/reloj, /test/correos
      # y /test/push solo porque corre con NODE_ENV=test (SEG-025).
      - name: Levantar la API y sus servicios
        run: docker compose -f apps/api/docker-compose.pruebas.yml up -d --build --wait

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # PENDIENTE: variante «e2e» en app.config (APP_VARIANT): reloj de prueba con el enlace
      # gymtrack://test/reloj, http permitido solo hacia 10.0.2.2 y nombre de paquete propio.
      - name: Compilar el APK e2e
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_API_URL: ${{ (inputs.suite == 'sin-senal') && 'http://10.0.2.2:8666' || 'http://10.0.2.2:3000' }}
        run: |
          pnpm --filter mobile exec expo prebuild --platform android --no-install
          cd apps/mobile/android && ./gradlew assembleRelease --no-daemon

      - name: Instalar Maestro
        run: |
          export MAESTRO_VERSION
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Snapshot del emulador en caché: la primera vez se crea, después arranca en segundos.
      - name: Caché del emulador
        uses: actions/cache@v4
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.NIVEL_API }}-${{ env.PERFIL }}

      - name: Crear el snapshot del emulador
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.NIVEL_API }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.PERFIL }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot creado"

      # PENDIENTE: copiar docs/pruebas/ci-propuesto/scripts/correr-maestro.sh a .github/scripts/.
      - name: Correr Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.NIVEL_API }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.PERFIL }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/correr-maestro.sh

      - name: Logs de la API, el worker y Toxiproxy
        if: always()
        run: docker compose -f apps/api/docker-compose.pruebas.yml logs --no-color > "$SALIDA/servicios.log" || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Maestro · suite ${SUITE} · API ${NIVEL_API} · ${PERFIL}"
            if [ -s "$SALIDA/inestables.txt" ]; then
              echo "Pasaron solo al reintentar (se abre issue «inestable»):"
              sed 's/^/- /' "$SALIDA/inestables.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Capturas, grabaciones, JUnit, logcat y logs de servicios.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-${{ env.SUITE }}-api${{ env.NIVEL_API }}
          path: ${{ env.SALIDA }}/
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

      - uses: actions/upload-artifact@v4
        if: success() && env.SUITE == 'humo'
        with:
          name: apk-e2e
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
