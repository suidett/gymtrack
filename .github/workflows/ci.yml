name: CI

on:
  push:
    branches: [main]
  pull_request:

# El GITHUB_TOKEN de cada job solo puede leer el repo.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL 16 para las pruebas de integración de apps/api (INT, SEG y CON con base).
    # Las claves son de esta corrida y de este contenedor, no un secreto.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymtrack
          POSTGRES_PASSWORD: gymtrack
          POSTGRES_DB: gymtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # La versión sale de packageManager en package.json (pnpm@12.6.0); declararla aquí también hace fallar la acción.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Pruebas
        run: pnpm test
        env:
          DATABASE_URL: postgresql://gymtrack:gymtrack@localhost:5432/gymtrack_test
      - name: Bundle de Android (prueba de humo)
        run: pnpm export:android
        env:
          CI: 1

  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Toda la historia: un secreto borrado en un commit posterior sigue en el repo.
          fetch-depth: 0
      # El binario oficial con su checksum: la acción de gitleaks pide licencia en organizaciones.
      - name: Secretos en el repo (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "$base/$archivo"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archivo}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - uses: pnpm/action-setup@v4
        # La versión sale de packageManager en package.json (pnpm@12.6.0); declararla aquí también hace fallar la acción.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lee pnpm-lock.yaml contra el registro: no hace falta instalar.
      # Por ahora solo informa: hay avisos en dependencias de la app móvil (node-forge, shell-quote,
      # zod, decode-uri-component, source-map-js y picomatch) que se corrigen subiendo versiones con
      # pnpm.overrides. Cuando estén al día, quitar continue-on-error para que vuelva a bloquear.
      - name: Dependencias con vulnerabilidades altas o críticas
        continue-on-error: true
        run: pnpm audit --audit-level high
