name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Pruebas
        run: pnpm test
      - name: Bundle de Android (prueba de humo)
        run: pnpm export:android
        env:
          CI: 1
