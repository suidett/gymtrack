packages:
  - apps/*
  - packages/*

# Expo necesita node_modules plano (como npm) para que Metro resuelva todo.
nodeLinker: hoisted
autoInstallPeers: true
allowBuilds:
  # Antes decía «set this to true or false» y pnpm 12 fallaba con ERR_PNPM_IGNORED_BUILDS.
  # false: el resolver de ESLint trae su binario precompilado y no necesita su script.
  unrs-resolver: false
  # La API: binario de Argon2, motores de Prisma (migraciones) y esbuild (build).
  argon2: true
  '@prisma/engines': true
  prisma: true
  esbuild: true
